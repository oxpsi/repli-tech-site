<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>repli.tech</title>
  <meta name="description" content="Protein nanotechnology — custom proteins, enzymes, and plasmids, built to order.">
  <meta property="og:title" content="repli.tech">
  <meta property="og:description" content="Protein nanotechnology — custom proteins, enzymes, and plasmids, built to order.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg transform='translate(5.1,7) scale(1.25)' fill='none' stroke-linecap='round'%3E%3Ccircle cx='14' cy='20' r='12' stroke='%2317A08F' stroke-width='3'/%3E%3Cpath d='M33 9.61 A12 12 0 1 0 39 20' stroke='%2355B545' stroke-width='3'/%3E%3Cpath d='M39 14 L42.2 19.8 L35.8 19.8 Z' fill='%2355B545' stroke='none'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #FBFAF7;
      --ink: #14201A;
      --muted: #5C6B63;
      --ring-left: #0E7C7C;   /* bluish green */
      --ring-right: #2F8C3E;  /* yellowish green */
      --bg-dots-opacity: 0.5;
      --bg-dots-blur: 9px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0D1512;
        --ink: #E9F1EB;
        --muted: #8FA39A;
        --ring-left: #35C9BD;
        --ring-right: #45C95F;
        --bg-dots-opacity: 0.4;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #bg-dots {
      position: fixed;
      inset: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      z-index: 0;
      pointer-events: none;
      opacity: var(--bg-dots-opacity);
      filter: blur(var(--bg-dots-blur));
    }
    main, footer { position: relative; z-index: 1; }
    .mark { width: 104px; height: auto; }
    .mark .ring-left { stroke: var(--ring-left); }
    .mark .ring-right { stroke: var(--ring-right); }
    .mark .arrow { fill: var(--ring-right); }
    .mark, h1, .tagline { filter: drop-shadow(0 0 8px var(--bg)); }
    h1 {
      margin-top: 20px;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    p.tagline {
      margin-top: 10px;
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 34ch;
    }
    footer {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <canvas id="bg-dots" aria-hidden="true"></canvas>
  <main>
    <svg class="mark" viewBox="0 0 44 40" fill="none" aria-hidden="true">
      <circle class="ring-left" cx="14" cy="20" r="12" stroke-width="2.75"/>
      <path class="ring-right" d="M33 9.61 A12 12 0 1 0 39 20" stroke-width="2.75" stroke-linecap="round"/>
      <path class="arrow" d="M39 14 L42.2 19.8 L35.8 19.8 Z"/>
    </svg>
    <h1>repli.tech</h1>
    <p class="tagline">protein nanotechnology</p>
  </main>
  <footer>© 2026 Replication Technologies</footer>

  <script>
    (function () {
      const canvas = document.getElementById('bg-dots');
      const ctx = canvas.getContext('2d');

      const SPACING = 96;                  // hex lattice pitch (px)
      const RADIUS = SPACING * 0.32;
      const FRAME_MS = 120;                // ~8 fps is plenty for slow drift
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      const SAT = 32;
      const LIGHT = dark ? 20 : 30;        // base lightness per theme

      let dots = [], W, H;

      function build() {
        W = canvas.width = canvas.clientWidth;
        H = canvas.height = canvas.clientHeight;
        dots = [];
        const rowH = SPACING * Math.sqrt(3) / 2;
        const rows = Math.ceil(H / rowH) + 1;
        const cols = Math.ceil(W / SPACING) + 1;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            dots.push({
              x: c * SPACING + (r % 2) * SPACING / 2 - SPACING / 2,
              y: r * rowH - rowH / 2,
              h0: 125 + Math.random() * 40,          // green ~125-165
              amp: 12 + Math.random() * 10,          // hue swing
              speed: 0.08 + Math.random() * 0.08,    // rad/s, period ~35-80s
              phase: Math.random() * Math.PI * 2,
              light: LIGHT + Math.random() * 6
            });
          }
        }
      }

      function draw(now) {
        const t = now / 1000;
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          ctx.fillStyle = `hsl(${d.h0 + d.amp * Math.sin(t * d.speed + d.phase)} ${SAT}% ${d.light}%)`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, RADIUS, 0, 6.2832);
          ctx.fill();
        }
      }

      let last = 0;
      function loop(now) {
        if (now - last >= FRAME_MS) { last = now; draw(now); }
        requestAnimationFrame(loop);
      }

      build();
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        draw(0);                                          // static frame
      } else {
        requestAnimationFrame(loop);                      // auto-pauses when tab hidden
      }
      let rT;
      addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(build, 150); });
    })();
  </script>
</body>
</html>
